name: Dispatch corrected 18.1 NORMAL

on:
  push:
    branches:
      - dispatch-18-1-normal-20260831

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch 18.1 NORMAL on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SaaSD3v/albus-kernel-build/actions/workflows/build-18.1.yml/dispatches \
            -d '{"ref":"main"}'
