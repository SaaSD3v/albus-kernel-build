name: Build Albus msm8953 LOS 15 (No KernelSU)

on:
  push:
    branches:
      - msm8953-lineage15-ci
    paths:
      - '.github/workflows/build-msm8953-los15-nonksu.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/SaaSD3v/kernel_motorola_msm8953.git
  KERNEL_BRANCH: lineage-15.1-albus-ci
  BASE_BRANCH: lineage-15.1
  BASE_SHA: e043ce3fb128f61698ab53311d20705685ac9b06

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl jq bc bison flex libssl-dev make libncurses-dev zip unzip python3 cpio

      - name: Clone committed msm8953 LOS 15 port
        run: |
          set -euxo pipefail
          git clone --depth=20 --branch "$KERNEL_BRANCH" --single-branch "$KERNEL_REPO" kernel
          cd kernel
          git fetch --depth=20 origin "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          test "$(git merge-base HEAD origin/$BASE_BRANCH)" = "$BASE_SHA"
          test "$(git rev-list --count origin/$BASE_BRANCH..HEAD)" = 10
          git --no-pager log --oneline origin/$BASE_BRANCH..HEAD

      - name: Verify port provenance and reject KernelSU
        run: |
          set -euxo pipefail
          cd kernel

          expected=(
            064c1c410c6f174e6f4c1d4462502cbca5b8d57d
            df88924352e30ea00bf25b59ffc1624fca657e1e
            dff95d9238ed8eec00b14ce9a4067ab996a58704
            14f9a7bf3342234fec55be38d0d57e8298013721
            43e5c1e815dd060a4d9807cab8bc543dc404750b
            95d58641559a1ce92d7468fd67a10d445b102bda
            7fd0914d8964b28ac4f2ded0c084c2b7615a8599
            516086ce0637a9e820793695a4dd8e3ff43e055b
            155561f0a3c1035128563a38670fed14fb26ee8c
            9a7416218ae637c4120c417b31428bb0747fdfdf
          )
          for c in "${expected[@]}"; do
            git log origin/$BASE_BRANCH..HEAD --format=%B | grep -q "cherry picked from commit $c"
          done

          test ! -d drivers/kernelsu
          ! grep -q '^CONFIG_KSU=' arch/arm64/configs/albus_defconfig
          ! grep -q '^CONFIG_KSU_' arch/arm64/configs/albus_defconfig

          grep -qx 'CONFIG_SYSVIPC=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_POSIX_MQUEUE=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_CGROUP_DEVICE=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_MEMCG=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_UTS_NS=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_USER_NS=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_PID_NS=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_IPC_NS=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_CGROUP_NET_PRIO=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_DEVTMPFS=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_VETH=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_OVERLAY_FS=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_DEVPTS_MULTIPLE_INSTANCES=y' arch/arm64/configs/albus_defconfig
          grep -qx 'CONFIG_ANDROID_PARANOID_NETWORK=n' arch/arm64/configs/albus_defconfig

          grep -q 'CGRP_ROOT_NOPREFIX' kernel/cgroup.c
          grep -q 'runtimes such as DroidSpaces and LXC' kernel/cgroup.c
          grep -q 'stats = &no_dev_stats;' net/netfilter/xt_qtaguid.c
          grep -q '^extern YYLTYPE yylloc;' scripts/dtc/dtc-lexer.l
          grep -q '^extern YYLTYPE yylloc;' scripts/dtc/dtc-lexer.lex.c_shipped
          grep -q '^#include <linux/android_aid.h>$' security/commoncap.c
          ! grep -q '^#ifdef CONFIG_ANDROID_PARANOID_NETWORK$' security/commoncap.c

      - name: Verify kernel version
        run: |
          set -euxo pipefail
          cd kernel
          VERSION=$(awk '/^VERSION =/{print $3}' Makefile)
          PATCHLEVEL=$(awk '/^PATCHLEVEL =/{print $3}' Makefile)
          SUBLEVEL=$(awk '/^SUBLEVEL =/{print $3}' Makefile)
          echo "Kernel: ${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"
          test "$VERSION" = 3
          test "$PATCHLEVEL" = 18
          test "$SUBLEVEL" = 71

      - name: Clone GCC 4.9
        run: |
          git clone --depth=1 --branch android-8.1.0_r42 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc49
          chmod +x gcc49/bin/* 2>/dev/null || true
          gcc49/bin/aarch64-linux-android-gcc --version

      - name: Generate and validate final config
        run: |
          set -euxo pipefail
          cd kernel
          mkdir -p out
          make O="$PWD/out" ARCH=arm64 albus_defconfig
          make O="$PWD/out" ARCH=arm64 olddefconfig
          test ! -e drivers/kernelsu
          ! grep -q '^CONFIG_KSU=' out/.config
          grep -qx '# CONFIG_ANDROID_PARANOID_NETWORK is not set' out/.config
          cd "$GITHUB_WORKSPACE"
          bash .github/scripts/verify-albus-container-config.sh kernel/out/.config

      - name: Compile Image.gz
        run: |
          set -euxo pipefail
          cd kernel
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc49/bin/aarch64-linux-android-"
          export HOSTLDFLAGS='-Wl,-z,muldefs'
          make -j"$(nproc)" O="$PWD/out" ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" HOSTLDFLAGS="$HOSTLDFLAGS" Image.gz
          test -s out/arch/arm64/boot/Image.gz

      - name: Export validated port series
        if: always()
        run: |
          set -euxo pipefail
          cd kernel
          mkdir -p "$GITHUB_WORKSPACE/validated-port"
          git format-patch --stdout origin/$BASE_BRANCH..HEAD > "$GITHUB_WORKSPACE/validated-port/los15-nonksu.patch"
          git log --format=fuller origin/$BASE_BRANCH..HEAD > "$GITHUB_WORKSPACE/validated-port/commits.txt"
          git diff --name-only origin/$BASE_BRANCH..HEAD > "$GITHUB_WORKSPACE/validated-port/changed-files.txt"
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            mkdir -p "$GITHUB_WORKSPACE/validated-port/files/$(dirname "$f")"
            cp -a "$f" "$GITHUB_WORKSPACE/validated-port/files/$f"
          done < "$GITHUB_WORKSPACE/validated-port/changed-files.txt"

      - name: Clone AnyKernel3
        if: success()
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

      - name: Prepare Albus AnyKernel zip
        if: success()
        run: |
          bash .github/scripts/package-albus-anykernel.sh anykernel kernel/out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/albus-msm8953-los15-nonksu.zip" albus-msm8953-los15-nonksu

      - name: Upload validated source delta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: albus-msm8953-los15-validated-port
          path: validated-port/
          if-no-files-found: error

      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: albus-msm8953-los15-nonksu
          path: albus-msm8953-los15-nonksu.zip
          if-no-files-found: error
