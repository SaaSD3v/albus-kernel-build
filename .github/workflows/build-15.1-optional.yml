name: Build Albus Kernel 15.1 (OPTIONAL)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl jq bc bison flex libssl-dev make libncurses-dev zip unzip python3

      - name: Clone kernel source
        run: git clone --depth=1 --branch lineage-15.1 --single-branch https://github.com/SaaSD3v/android_kernel_motorola_msm8996.git kernel

      - name: Verify fixed source and remove only optional firewall block
        run: |
          set -euxo pipefail
          cd kernel
          grep -qx 'CONFIG_ANDROID_PARANOID_NETWORK=n' arch/arm64/configs/albus_defconfig
          grep -q '^#include <linux/android_aid.h>$' security/commoncap.c
          ! grep -q '^#ifdef CONFIG_ANDROID_PARANOID_NETWORK$' security/commoncap.c
          grep -q 'AID_NET_RAW' security/commoncap.c
          grep -q 'AID_NET_ADMIN' security/commoncap.c
          grep -q '^CONFIG_KSU=y$' arch/arm64/configs/albus_defconfig
          python3 - <<'PY'
          from pathlib import Path
          p = Path('arch/arm64/configs/albus_defconfig')
          lines = p.read_text().splitlines(keepends=True)
          start = [i for i,l in enumerate(lines) if l.rstrip('\n') == '# CONFIG_IP_SET is not set']
          end = [i for i,l in enumerate(lines) if l.rstrip('\n') == '# CONFIG_IP_VS is not set']
          if len(start) != 1 or len(end) != 1 or end[0] <= start[0]:
              raise SystemExit(f'unexpected optional block anchors: IP_SET={start}, IP_VS={end}')
          s,e = start[0],end[0]
          block = lines[s+1:e]
          if len(block) != 14:
              raise SystemExit(f'expected 14 lines in optional block, found {len(block)}')
          required = {
              'CONFIG_IP_SET=y','CONFIG_IP_SET_HASH_IP=y','CONFIG_IP_SET_HASH_NET=y',
              'CONFIG_NETFILTER_XT_SET=y','CONFIG_NETFILTER_XT_MATCH_RECENT=y',
              'CONFIG_NETFILTER_XT_MATCH_LIMIT=y','CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y',
              'CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y','CONFIG_NETFILTER_XT_MATCH_MARK=y',
              'CONFIG_NETFILTER_XT_TARGET_MARK=y','CONFIG_NETFILTER_NETLINK_QUEUE=y',
              'CONFIG_NETFILTER_NETLINK_LOG=y','CONFIG_NETFILTER_XT_TARGET_NFLOG=y'
          }
          actual = {l.rstrip('\n') for l in block}
          missing = sorted(required - actual)
          if missing: raise SystemExit(f'optional block missing expected markers: {missing}')
          if not any('CONFIG_NETFILTER_XT_MATCH_OWNER' in l for l in actual):
              raise SystemExit('optional block has no MATCH_OWNER entry')
          del lines[s+1:e]
          p.write_text(''.join(lines))
          PY
          grep -qx 'CONFIG_ANDROID_PARANOID_NETWORK=n' arch/arm64/configs/albus_defconfig
          grep -q '^# CONFIG_IP_SET is not set$' arch/arm64/configs/albus_defconfig
          ! grep -q '^CONFIG_IP_SET=y$' arch/arm64/configs/albus_defconfig
          grep -q '^# CONFIG_NETFILTER_XT_MATCH_RECENT is not set$' arch/arm64/configs/albus_defconfig
          grep -q '^# CONFIG_NETFILTER_XT_MATCH_OWNER is not set$' arch/arm64/configs/albus_defconfig
          grep -q '^CONFIG_NETFILTER_XT_MATCH_LIMIT=y$' arch/arm64/configs/albus_defconfig
          grep -q '^CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y$' arch/arm64/configs/albus_defconfig
          grep -q '^CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y$' arch/arm64/configs/albus_defconfig
          grep -q '^CONFIG_NETFILTER_XT_MATCH_MARK=y$' arch/arm64/configs/albus_defconfig
          grep -q '^CONFIG_NETFILTER_XT_TARGET_MARK=y$' arch/arm64/configs/albus_defconfig
          grep -q '^CONFIG_NETFILTER_NETLINK_QUEUE=y$' arch/arm64/configs/albus_defconfig
          grep -q '^CONFIG_NETFILTER_NETLINK_LOG=y$' arch/arm64/configs/albus_defconfig
          grep -q '^CONFIG_NETFILTER_XT_TARGET_NFLOG=y$' arch/arm64/configs/albus_defconfig

      - name: Verify kernel version
        run: |
          cd kernel
          VERSION=$(grep '^VERSION =' Makefile | awk '{print $3}')
          PATCHLEVEL=$(grep '^PATCHLEVEL =' Makefile | awk '{print $3}')
          SUBLEVEL=$(grep '^SUBLEVEL =' Makefile | awk '{print $3}')
          echo "Kernel: $VERSION.$PATCHLEVEL.$SUBLEVEL"
          [ "$VERSION" = "3" ] && [ "$PATCHLEVEL" = "18" ] && [ "$SUBLEVEL" = "71" ]

      - name: Clone GCC 4.9
        run: git clone --depth=1 --branch android-8.1.0_r42 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc49

      - name: Validate toolchain
        run: |
          chmod +x gcc49/bin/* 2>/dev/null || true
          gcc49/bin/aarch64-linux-android-gcc --version

      - name: Build config and verify final OPTIONAL state
        run: |
          set -euxo pipefail
          cd kernel
          mkdir -p out
          make O="$PWD/out" ARCH=arm64 albus_defconfig
          make O="$PWD/out" ARCH=arm64 olddefconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^# CONFIG_ANDROID_PARANOID_NETWORK is not set$' out/.config
          grep -q '^# CONFIG_IP_SET is not set$' out/.config
          grep -q '^# CONFIG_NETFILTER_XT_MATCH_RECENT is not set$' out/.config
          grep -q '^# CONFIG_NETFILTER_XT_MATCH_OWNER is not set$' out/.config
          grep -q '^CONFIG_NETFILTER_XT_MATCH_LIMIT=y$' out/.config
          grep -q '^CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y$' out/.config
          grep -q '^CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y$' out/.config
          grep -q '^CONFIG_NETFILTER_XT_MATCH_MARK=y$' out/.config
          grep -q '^CONFIG_NETFILTER_XT_TARGET_MARK=y$' out/.config
          grep -q '^CONFIG_NETFILTER_NETLINK_QUEUE=y$' out/.config
          grep -q '^CONFIG_NETFILTER_NETLINK_LOG=y$' out/.config
          grep -q '^CONFIG_NETFILTER_XT_TARGET_NFLOG=y$' out/.config

      - name: Verify container compatibility
        run: bash .github/scripts/verify-albus-container-config.sh kernel/out/.config

      - name: Compile kernel
        run: |
          cd kernel
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc49/bin/aarch64-linux-android-"
          export HOSTLDFLAGS='-Wl,-z,muldefs'
          make -j$(nproc) O="$PWD/out" ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" HOSTLDFLAGS="$HOSTLDFLAGS" Image.gz

      - name: Verify Image.gz
        run: ls -la kernel/out/arch/arm64/boot/Image.gz

      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

      - name: Prepare albus AnyKernel zip
        run: |
          bash .github/scripts/package-albus-anykernel.sh anykernel kernel/out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/albus-kernel-15.1-optional.zip" albus-kernel-15.1-optional

      - name: Upload to GoFile
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          SERVER=$(curl -fsSL https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          RESPONSE=$(curl -fsSL -X POST "https://${SERVER}.gofile.io/contents/uploadfile" -H "Authorization: Bearer ${GOFILE_TOKEN}" -F "file=@albus-kernel-15.1-optional.zip")
          echo "$RESPONSE" | jq .
          DOWNLOAD_PAGE=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
          test -n "$DOWNLOAD_PAGE" && test "$DOWNLOAD_PAGE" != 'null'
          echo "GoFile link: $DOWNLOAD_PAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: albus-kernel-15.1-optional
          path: albus-kernel-15.1-optional.zip
