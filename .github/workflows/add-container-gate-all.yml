name: Add container gate to all Albus builds

on:
  push:
    paths:
      - '.github/workflows/add-container-gate-all.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Add permanent gate to all eight workflows
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [
              '.github/workflows/build.yml',
              '.github/workflows/build-15.1-optional.yml',
              '.github/workflows/build-pinned.yml',
              '.github/workflows/build-15.1-no-ksu-optional.yml',
              '.github/workflows/build-18.1.yml',
              '.github/workflows/build-18.1-optional.yml',
              '.github/workflows/build-18.1-no-ksu.yml',
              '.github/workflows/build-18.1-no-ksu-optional.yml',
          ]
          marker='      - name: Compile kernel\n'
          gate=(
              '      - name: Verify container compatibility\n'
              '        run: bash .github/scripts/verify-albus-container-config.sh kernel/out/.config\n\n'
          )
          for fn in files:
              p=Path(fn)
              s=p.read_text()
              if 'Verify container compatibility' in s:
                  raise SystemExit(f'gate already exists unexpectedly in {fn}')
              if s.count(marker) != 1:
                  raise SystemExit(f'compile marker count != 1 in {fn}')
              p.write_text(s.replace(marker, gate+marker, 1))
          PY
          for f in \
            .github/workflows/build.yml \
            .github/workflows/build-15.1-optional.yml \
            .github/workflows/build-pinned.yml \
            .github/workflows/build-15.1-no-ksu-optional.yml \
            .github/workflows/build-18.1.yml \
            .github/workflows/build-18.1-optional.yml \
            .github/workflows/build-18.1-no-ksu.yml \
            .github/workflows/build-18.1-no-ksu-optional.yml; do
              grep -q 'Verify container compatibility' "$f"
              grep -q 'verify-albus-container-config.sh kernel/out/.config' "$f"
          done
          git diff --check
      - name: Commit
        run: |
          git config user.name SaaSD3v
          git config user.email saasd3v@users.noreply.github.com
          git rm .github/workflows/add-container-gate-all.yml
          git add .github/workflows/*.yml
          git commit -m 'gate all Albus builds on container compatibility'
          git push origin HEAD:main
