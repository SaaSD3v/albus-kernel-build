name: Dispatch final audited Albus matrix

on:
  push:
    paths:
      - '.github/workflows/dispatch-final-audited-matrix.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch all eight audited workflows
        run: |
          set -euxo pipefail
          gh workflow run build.yml --repo SaaSD3v/albus-kernel-build --ref main
          gh workflow run build-15.1-optional.yml --repo SaaSD3v/albus-kernel-build --ref main
          gh workflow run build-pinned.yml --repo SaaSD3v/albus-kernel-build --ref main
          gh workflow run build-15.1-no-ksu-optional.yml --repo SaaSD3v/albus-kernel-build --ref main
          gh workflow run build-18.1.yml --repo SaaSD3v/albus-kernel-build --ref main
          gh workflow run build-18.1-optional.yml --repo SaaSD3v/albus-kernel-build --ref main
          gh workflow run build-18.1-no-ksu.yml --repo SaaSD3v/albus-kernel-build --ref main
          gh workflow run build-18.1-no-ksu-optional.yml --repo SaaSD3v/albus-kernel-build --ref main
