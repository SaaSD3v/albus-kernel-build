name: Build Albus Linux 4.9 DroidSpaces

on:
  push:
    branches:
      - albus-4.9-droidspaces-ci
    paths:
      - '.github/workflows/build-albus49-droidspaces.yml'
      - '.github/scripts/package-albus49-anykernel.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/SaaSD3v/kernel_motorola_msm8593_4.9.git
  KERNEL_BRANCH: lineage-15.1-albus-droidspaces-4.9

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev make libncurses-dev zip unzip python3 cpio

      - name: Clone Albus 4.9 staging branch
        run: |
          git clone --depth=20 --branch "$KERNEL_BRANCH" --single-branch "$KERNEL_REPO" kernel
          cd kernel
          git log -7 --oneline
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 9$' Makefile
          grep -q 'CONFIG_ALBUS_DTB=y' arch/arm64/configs/albus_defconfig
          grep -q 'static struct file_system_type cgroup2_fs_type;' kernel/cgroup.c
          grep -q 'CLONE_NEWCGROUP' kernel/nsproxy.c
          test ! -d drivers/kernelsu
          test -f droidspaces/patches/0003-audio-fix-madera-unused-codec.patch
          test -f droidspaces/patches/0004-nfc-pass-device-to-hw-check.patch

      - name: Apply DroidSpaces source compatibility patches
        run: |
          set -euxo pipefail
          cd kernel
          for p in droidspaces/patches/*.patch; do
            echo "Applying $p"
            git apply --check "$p"
            git apply "$p"
          done
          grep -q 'DroidSpaces/LXC compatibility' kernel/cgroup.c
          grep -q '^#include <linux/android_aid.h>$' security/commoncap.c
          ! grep -q '^#ifdef CONFIG_ANDROID_PARANOID_NETWORK$' security/commoncap.c
          grep -q 'struct nqx_dev \*nqx_dev)' drivers/nfc/nq-nci.c

      - name: Clone Android GCC 4.9 toolchains
        run: |
          git clone --depth=1 --branch android-8.1.0_r42 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 --branch android-8.1.0_r42 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32
          chmod +x gcc64/bin/* gcc32/bin/* 2>/dev/null || true
          gcc64/bin/aarch64-linux-android-gcc --version
          gcc32/bin/arm-linux-androideabi-gcc --version

      - name: Generate Albus config and merge DroidSpaces fragments
        run: |
          set -euxo pipefail
          cd kernel
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"
          mkdir -p out
          make O="$PWD/out" ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            albus_defconfig

          apply_fragment() {
            local f="$1"
            while IFS= read -r line; do
              case "$line" in
                CONFIG_*=y)
                  sym="${line#CONFIG_}"; sym="${sym%=y}"
                  scripts/config --file out/.config -e "$sym"
                  ;;
                '# CONFIG_'*' is not set')
                  sym="${line#\# CONFIG_}"; sym="${sym% is not set}"
                  scripts/config --file out/.config -d "$sym"
                  ;;
              esac
            done < "$f"
          }

          apply_fragment droidspaces/albus-4.9.config
          apply_fragment droidspaces/albus-4.9-network.config
          make O="$PWD/out" ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            olddefconfig

          cp out/.config "$GITHUB_WORKSPACE/albus49-final.config"

      - name: Validate required 4.9 container features
        run: |
          set -euxo pipefail
          C=kernel/out/.config
          required=(
            CONFIG_SYSVIPC=y
            CONFIG_POSIX_MQUEUE=y
            CONFIG_CGROUPS=y
            CONFIG_CGROUP_PIDS=y
            CONFIG_CGROUP_DEVICE=y
            CONFIG_MEMCG=y
            CONFIG_UTS_NS=y
            CONFIG_IPC_NS=y
            CONFIG_PID_NS=y
            CONFIG_NET_NS=y
            CONFIG_USER_NS=y
            CONFIG_DEVTMPFS=y
            CONFIG_OVERLAY_FS=y
            CONFIG_VETH=y
            CONFIG_BRIDGE=y
            CONFIG_NETFILTER=y
            CONFIG_NF_CONNTRACK=y
            CONFIG_IP_NF_IPTABLES=y
            CONFIG_IP_NF_NAT=y
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          )
          for x in "${required[@]}"; do grep -qx "$x" "$C"; done
          grep -qx '# CONFIG_ANDROID_PARANOID_NETWORK is not set' "$C"
          ! grep -q '^CONFIG_KSU' "$C"

          echo '--- cgroup-related final config ---'
          grep -E 'CONFIG_(CGROUP|MEMCG|CPUSETS|.*_NS)=' "$C" | sort || true
          echo '--- networking final config ---'
          grep -E 'CONFIG_(VETH|BRIDGE|NF_|NFT_|IP_NF_|NETFILTER|IP_SET)' "$C" | sort || true

      - name: Compile Linux 4.9 kernel and Albus-only separated DTBs
        run: |
          set -euxo pipefail
          cd kernel
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"
          export HOSTLDFLAGS='-Wl,-z,muldefs'
          make -j"$(nproc)" O="$PWD/out" ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            HOSTLDFLAGS="$HOSTLDFLAGS" Image.gz dtbs
          test -s out/arch/arm64/boot/Image.gz
          mapfile -t ALBUS_DTBS < <(find out/arch/arm64/boot/dts/qcom -maxdepth 1 -type f -name 'msm8953-albus*.dtb' -print | sort)
          printf 'Albus DTBs (%d):\n' "${#ALBUS_DTBS[@]}"
          printf '%s\n' "${ALBUS_DTBS[@]}"
          test "${#ALBUS_DTBS[@]}" -gt 0
          : > "$GITHUB_WORKSPACE/albus49-dtb.img"
          for dtb in "${ALBUS_DTBS[@]}"; do
            cat "$dtb" >> "$GITHUB_WORKSPACE/albus49-dtb.img"
          done
          test -s "$GITHUB_WORKSPACE/albus49-dtb.img"
          sha256sum "$GITHUB_WORKSPACE/albus49-dtb.img"

      - name: Report optional kernel modules
        run: |
          cd kernel
          find out -type f -name '*.ko' -print | sort | tee "$GITHUB_WORKSPACE/albus49-modules.txt" || true

      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

      - name: Package flashable Albus 4.9 test ZIP
        run: |
          bash .github/scripts/package-albus49-anykernel.sh \
            anykernel \
            kernel/out/arch/arm64/boot/Image.gz \
            albus49-dtb.img \
            "$GITHUB_WORKSPACE/albus-linux-4.9-droidspaces-los15.zip" \
            albus-linux-4.9-droidspaces-los15
          unzip -l albus-linux-4.9-droidspaces-los15.zip | grep -E 'Image.gz|dtb|anykernel.sh'
          sha256sum albus-linux-4.9-droidspaces-los15.zip | tee albus-linux-4.9-droidspaces-los15.zip.sha256

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: albus-linux-4.9-droidspaces-los15
          path: |
            albus-linux-4.9-droidspaces-los15.zip
            albus-linux-4.9-droidspaces-los15.zip.sha256
          if-no-files-found: error

      - name: Upload validation files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: albus-linux-4.9-droidspaces-validation
          path: |
            albus49-final.config
            albus49-dtb.img
            albus49-modules.txt
          if-no-files-found: warn
