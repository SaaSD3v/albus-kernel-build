name: Dispatch full Albus Wi-Fi-fixed matrix

on:
  push:
    paths:
      - '.github/workflows/dispatch-all-paranoid-wifi-fixed.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Dispatch all eight workflows
        run: |
          set -euxo pipefail
          gh workflow run build.yml --ref main
          gh workflow run build-15.1-optional.yml --ref main
          gh workflow run build-pinned.yml --ref main
          gh workflow run build-15.1-no-ksu-optional.yml --ref main
          gh workflow run build-18.1.yml --ref main
          gh workflow run build-18.1-optional.yml --ref main
          gh workflow run build-18.1-no-ksu.yml --ref main
          gh workflow run build-18.1-no-ksu-optional.yml --ref main
      - name: Remove temporary dispatcher
        run: |
          git config user.name SaaSD3v
          git config user.email saasd3v@users.noreply.github.com
          git rm .github/workflows/dispatch-all-paranoid-wifi-fixed.yml
          git commit -m 'remove temporary full-matrix dispatcher'
          git push origin HEAD:main
